              Fn::GetAtt:
              - "MainIdentityPoolIAMAuthRole"
              - "Arn"
    Metadata:
      SamResourceId: "BackendBucketBucketPolicy"
    Type: "AWS::S3::BucketPolicy"
  MainUserpool:
    Properties:
      Policies:
        PasswordPolicy:
