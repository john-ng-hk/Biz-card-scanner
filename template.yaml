      UserPoolName:
        Fn::Sub: "${AWS::StackName}-MainUserpool"
      Schema:
      - Required: false
        Name: "email"
        AttributeDataType: "String"
    Metadata:
      SamResourceId: "MainUserpool"
    Type: "AWS::Cognito::UserPool"
  MainFunctionDeleteContactPermissionProd:
    Properties:
