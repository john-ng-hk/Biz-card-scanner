      SourceArn:
        Fn::Sub:
        - "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${__ApiId__}/${__Stage__}/DELETE/contacts/*"
        - __Stage__: "*"
          __ApiId__:
            Ref: "MainAPIGateway"
      Principal: "apigateway.amazonaws.com"
    Type: "AWS::Lambda::Permission"
  MainFunctionGetVCardPermissionProd:
